<!doctype html>

    <meta charset="UTF-8" />

    <!-- Automatic Localhost Service Worker Buster -->
    <script>
      (function() {
        var isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        if (isLocal) {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            }).catch(function() {});
          }
          if ('caches' in window) {
            caches.keys().then(function(keys) {
              for (var j = 0; j < keys.length; j++) {
                caches.delete(keys[j]);
              }
            }).catch(function() {});
          }
        }
      })();
    </script>
    <title>ClaimVault — Smart Purchase, Warranty & Receipt Vault</title>
    <meta name="description" content="Never lose track of what you bought. Store receipts, monitor return periods with live countdowns, and receive proactive warranty alerts." />
    
    <!-- OpenGraph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ClaimVault — Smart Purchase & Warranty Vault" />
    <meta property="og:description" content="Never lose track of what you bought. Personal purchase, warranty & receipt manager." />
    <meta property="og:image" content="/claimvault-logo.png" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
